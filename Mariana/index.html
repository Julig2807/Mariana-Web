<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Isa</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="beach" aria-hidden="true">
    <div class="beach__sun"></div>
    <div class="beach__sea"></div>
    <div class="beach__wave beach__wave--1"></div>
    <div class="beach__wave beach__wave--2"></div>
    <div class="beach__wave beach__wave--3"></div>
    <div class="beach__sand"></div>
  </div>

  <main>
    <section class="hero" id="inicio">
      <p class="eyebrow">Para Isa</p>
      <h1 class="title">Tu Universo</h1>
      <p class="lead">
        Hay cielos que se miran con calma, y este es uno hecho para ti.
      </p>
    </section>

    <section class="secret" id="mensaje">
      <p class="eyebrow">Un mensaje, pero es secreto...</p>

      <div class="secret__message">
        <p>Confío en ti, hoy y siempre.</p>
        <p>Ve con calma; el cielo estará aquí cuando regreses.</p>
        <p>Siempre recuerda que algún día serás mía...</p>
      </div>

      <p class="secret__signature">Hecho para Isa — Att. Julián</p>
    </section>
  </main>

</body>
</html>
